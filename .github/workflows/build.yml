name: Build

on:
  push:
    branches:
      - ci-builds
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libcurl4-openssl-dev xvfb
          sudo apt-get install -y libstdc++-12-dev || sudo apt-get install -y libstdc++-14-dev

      - name: Create .env
        run: cp .env.sample .env

      - name: Run tests
        run: flutter test

      - name: Build Linux
        run: flutter build linux --release

      - name: Require the sqlite3 native asset
        run: |
          find build/linux/x64/release/bundle -name '*sqlite3*' -print
          test -n "$(find build/linux/x64/release/bundle -name '*sqlite3*')"

      - name: Start the Linux build
        run: |
          set +e
          xvfb-run -a timeout 20s ./AdGuardHomeManager >"$RUNNER_TEMP/app.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/app.log"
          if [ "$code" -ne 124 ]; then
            echo "Process exited with $code. A running app is stopped by timeout with 124."
            exit 1
          fi
          if grep -E -i 'SqfliteFfiException|couldn.t load.*sqlite3' "$RUNNER_TEMP/app.log"; then
            exit 1
          fi
        working-directory: build/linux/x64/release/bundle

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Create .env
        run: cp .env.sample .env

      - name: Build Android debug APK
        run: flutter build apk --debug

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Create .env
        run: Copy-Item .env.sample .env

      - name: Run tests
        run: flutter test

      - name: Build Windows
        run: flutter build windows --release

      - name: Require the sqlite3 native asset
        run: |
          Get-ChildItem -Recurse build\windows\x64\runner\Release -Filter *sqlite3*
          if (-not (Get-ChildItem -Recurse build\windows\x64\runner\Release -Filter *sqlite3*)) {
            exit 1
          }

      - name: Start the Windows build
        run: |
          $dir = Resolve-Path build\windows\x64\runner\Release
          $exe = Join-Path $dir "adguard_home_manager.exe"
          $out = Join-Path $env:RUNNER_TEMP "app.out"
          $err = Join-Path $env:RUNNER_TEMP "app.err"
          $proc = Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 20
          $alive = -not $proc.HasExited
          if (-not $alive) {
            Write-Host "Process exited with $($proc.ExitCode)"
          }
          if (Test-Path $out) { Get-Content $out }
          if (Test-Path $err) { Get-Content $err }
          if (-not $alive) { exit 1 }
          Stop-Process -Id $proc.Id -Force
          $combined = @()
          if (Test-Path $out) { $combined += Get-Content $out }
          if (Test-Path $err) { $combined += Get-Content $err }
          if ($combined -match 'SqfliteFfiException|couldn.t load.*sqlite3') { exit 1 }

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Create .env
        run: cp .env.sample .env

      - name: Run tests
        run: flutter test

      - name: Build macOS without a signing certificate
        run: |
          printf '\nCODE_SIGN_IDENTITY = -\nCODE_SIGNING_REQUIRED = NO\nCODE_SIGNING_ALLOWED = NO\n' >> macos/Runner/Configs/Release.xcconfig
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' '/DEVELOPMENT_TEAM/d' macos/Runner.xcodeproj/project.pbxproj
          flutter build macos --release

      - name: Build iOS without signing
        run: flutter build ios --no-codesign --debug
